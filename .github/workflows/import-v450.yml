name: Import SANNAR v4.5.0 Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-v450.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build package
        run: |
          URL="$(sed -n 's/.*](\(https:[^)]*\)).*/\1/p' TEMP_V450_DOWNLOAD.md | head -n1)"
          test -n "$URL"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o SANNAR_v4.5.0_CAFEBAZAAR_UPDATE_UNSIGNED.zip
          test -s SANNAR_v4.5.0_CAFEBAZAAR_UPDATE_UNSIGNED.zip
          unzip -t SANNAR_v4.5.0_CAFEBAZAAR_UPDATE_UNSIGNED.zip
          sha256sum SANNAR_v4.5.0_CAFEBAZAAR_UPDATE_UNSIGNED.zip

      - name: Publish public handoff release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sannar-v4.5.0-unsigned"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "SANNAR v4.5.0 unsigned build" --notes "Temporary unsigned build package for final signing and CafeBazaar validation."
          gh release upload "$TAG" SANNAR_v4.5.0_CAFEBAZAAR_UPDATE_UNSIGNED.zip --clobber
