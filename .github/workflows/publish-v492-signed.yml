name: Publish SANNAR v4.9.2 signed binaries
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v492-signed.yml'
      - 'SANNAR_V492_PUBLIC_DOWNLOADS.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and retrieve signed binaries
        shell: bash
        run: |
          set -euo pipefail
          test -s SANNAR_V492_PUBLIC_DOWNLOADS.txt
          while IFS='|' read -r file b64url; do
            case "$file" in
              SANNAR_v4.9.2_CAFEBAZAAR_SIGNED.apk|SANNAR_v4.9.2_CAFEBAZAAR_SIGNED.aab|SANNAR_v4.9.2_CAFEBAZAAR_FINAL_SIGNED.zip) ;;
              *) echo "Unexpected file: $file"; exit 1 ;;
            esac
            url="$(printf %s "$b64url" | base64 -d)"
            curl -fL --retry 3 --retry-delay 2 --max-time 600 "$url" -o "$file"
            test -s "$file"
          done < SANNAR_V492_PUBLIC_DOWNLOADS.txt
          echo '325b08724af74fe3475d4cc73f4973947ea099d5ef6a32a2329a0b831ba7a550  SANNAR_v4.9.2_CAFEBAZAAR_SIGNED.apk' | sha256sum -c -
          echo '0cfbe7050babb03d636db23946e45a67a7792b5a5b18d1adb8b9159199ed7f3c  SANNAR_v4.9.2_CAFEBAZAAR_SIGNED.aab' | sha256sum -c -
          echo '9ae3e9a1525085383d78eac0eb29a0a69e60677b4ffa4b2a2757e5e80e11a1e9  SANNAR_v4.9.2_CAFEBAZAAR_FINAL_SIGNED.zip' | sha256sum -c -
          unzip -t SANNAR_v4.9.2_CAFEBAZAAR_FINAL_SIGNED.zip > /dev/null
      - name: Publish signed version 4.9.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=sannar-v4.9.2-cafebazaar-signed
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'SANNAR 4.9.2 (signed)' --notes 'Original signed APK, AAB and ZIP transferred from authenticated project release; SHA-256 checked against upstream.' --latest
          gh release upload "$TAG" SANNAR_v4.9.2_CAFEBAZAAR_SIGNED.apk SANNAR_v4.9.2_CAFEBAZAAR_SIGNED.aab SANNAR_v4.9.2_CAFEBAZAAR_FINAL_SIGNED.zip --clobber
